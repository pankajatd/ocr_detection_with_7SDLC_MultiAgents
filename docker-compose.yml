version: "3.8"

services:
  ocr_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ocr-detection:1.0.0
    container_name: ocr_detection_service
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
